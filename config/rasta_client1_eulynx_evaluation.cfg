; Cloud IXL evaluation profile for the Eu.Doc.92 UDP reference parameters.
;
; This is a partial, interoperability-constrained profile for the current
; Pedro OC. It is not an exact Eu.Doc.92 profile and is not evidence of
; EULYNX, RaSTA, EN 50159 or SIL4 compliance.
;
; Deliberate compatibility deviations:
;   RASTA_T_MAX remains 10000 because the OC sends heartbeats every 2000 ms.
;   RASTA_SR_CHECKSUM_LEN remains NONE because checksum length must match.
;
; Local Cloud IXL endpoints are configured independently below. Remote OC
; endpoints remain independently selectable with CLOUD_IXL_OC_CH1_IP/PORT
; and CLOUD_IXL_OC_CH2_IP/PORT.

; Safety/Retransmission layer
RASTA_T_MAX = 10000
RASTA_T_H = 300

RASTA_SR_CHECKSUM_LEN = NONE
RASTA_SR_CHECKSUM_ALGO = MD4
RASTA_SR_CHECKSUM_KEY = #12345678

RASTA_MD4_A = #67452301
RASTA_MD4_B = #efcdab89
RASTA_MD4_C = #98badcfe
RASTA_MD4_D = #10325476

RASTA_SEND_MAX = 20
RASTA_MWA = 10
RASTA_MAX_PACKET = 1
RASTA_DIAG_WINDOW = 5000
RASTA_INITIAL_SEQ = -1

; Redundancy layer: these are local bind endpoints, one per UDP socket.
; Distinct IPs only demonstrate physical diversity when they belong to
; physically independent NICs and routes.
RASTA_REDUNDANCY_CONNECTIONS = {"192.168.0.151:9998"; "192.168.0.151:9999"}

RASTA_CRC_TYPE = TYPE_A
RASTA_T_SEQ = 100
RASTA_N_DIAGNOSE = 100
RASTA_N_DEFERQUEUE_SIZE = 4

; General
RASTA_NETWORK = 1234
RASTA_ID = #00000062

; Logger
LOGGER_TYPE = 0
LOGGER_FILE = "output.log"
LOGGER_MAX_LEVEL = 1

RASTA_ACCEPTED_VERSIONS = {"0303"}
